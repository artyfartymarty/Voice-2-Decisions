# Text to decisions: Nova Sonic transcript text in, variables -> auto-called functions -> Winnow-12B picks the answer.
#   ./setup.sh                 # first time: checks the GPU, downloads the model from GitHub, builds, starts
#   docker compose up -d       # after that
x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  # The decision model: Winnow-12B Q8 on winnow-server, built from EldanRing/winnow-inference on GitHub (pinned
  # commit) for the GPU architecture in CUDA_ARCH (setup.sh sets it from nvidia-smi). The weights are read from
  # ./models/winnow, which scripts/fetch_model.sh fills from this repo's GitHub release.
  winnow:
    <<: *gpu
    build:
      context: https://github.com/EldanRing/winnow-inference.git#a50c7d0d8cbc5c3ba34987c5c23ea114e44ce6b5
      args:
        CUDA_ARCH: ${CUDA_ARCH:-86}
    image: winnow-inference:a50c7d0
    entrypoint: ["python3", "/wrap/serve.py", "--model", "q8"]
    environment:
      WINNOW_CONTEXT: ${WINNOW_CONTEXT:-4096}
    volumes:
      - ./models/winnow:/models:ro
      - ../winnow:/wrap:ro
    restart: unless-stopped

  # The API: transcript events in, variables / function results / decisions out. Falls back to keyword rules while
  # Winnow is still loading, so it is usable from the first second.
  api:
    build:
      context: ..
      dockerfile: decisions/Dockerfile
    image: text2decisions:latest
    environment:
      WINNOW_URL: http://winnow:8091
      DECIDE_MIN_P: ${DECIDE_MIN_P:-0.5}
      ROLE_MAP: ${ROLE_MAP:-USER:caller,ASSISTANT:agent}
      DECISION_WEBHOOK_URL: ${DECISION_WEBHOOK_URL:-}
      REFERENCE_DIR: ${REFERENCE_DIR:-}
      EXTRACT_MODE: ${EXTRACT_MODE:-model}
      EXTRACT_MODEL_URL: ${EXTRACT_MODEL_URL:-}
      EXTRACT_MODEL: ${EXTRACT_MODEL:-}
      EXTRACT_MODEL_API_KEY: ${EXTRACT_MODEL_API_KEY:-}
      EXTRACT_MODEL_REASONING: ${EXTRACT_MODEL_REASONING:-}
      EXTRACT_MODEL_TIMEOUT: ${EXTRACT_MODEL_TIMEOUT:-3}
    ports:
      - "${PORT:-8000}:8000"
    # Real reference data: put customers.csv + location_notes.csv (+ disputes.csv, fleet.csv, airport_aliases.csv)
    # in ./reference, uncomment, and set REFERENCE_DIR=/reference in .env.
    # volumes:
    #   - ./reference:/reference:ro
    depends_on:
      - winnow
    restart: unless-stopped
