<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Text to Decisions</title>
<style>
  :root { --bg:#f6f7f9; --panel:#fff; --text:#1c2230; --muted:#667085; --line:#e3e6eb; --accent:#2457d6; --ok:#16794c; --warn:#a15c00; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12151b; --panel:#1b1f27; --text:#e6e9ef; --muted:#98a2b3; --line:#2b313c; --accent:#7aa2ff; --ok:#4cc38a; --warn:#f0b35a; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 system-ui, sans-serif; }
  header { padding:14px 16px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0 12px 0 0; }
  main { display:grid; grid-template-columns: minmax(0,1.1fr) minmax(0,1fr); gap:14px; padding:14px 16px; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  section { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
  h2 { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 8px; }
  button, select, input { font:inherit; color:inherit; background:var(--panel); border:1px solid var(--line); border-radius:7px; padding:6px 10px; }
  button { cursor:pointer; } button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  form { display:flex; gap:8px; margin-top:10px; } form input { flex:1; min-width:0; }
  .decision { font-size:16px; } .decision .fn { font-weight:600; color:var(--accent); }
  .decision.waiting .fn { color:var(--warn); } .meta { color:var(--muted); font-size:12px; }
  table { width:100%; border-collapse:collapse; } td { padding:4px 6px; border-top:1px solid var(--line); vertical-align:top; }
  td:first-child { color:var(--muted); white-space:nowrap; }
  .fnrow .state { font-size:12px; } .ready { color:var(--ok); } .need { color:var(--muted); }
  .line { padding:3px 0; } .line b { display:inline-block; min-width:52px; color:var(--muted); font-weight:500; }
  .line.caller b { color:var(--accent); } #transcript { max-height:340px; overflow:auto; }
  .prompt { color:var(--warn); font-size:13px; }
</style>
</head>
<body>
<header>
  <h1>Text to Decisions</h1>
  <span class="meta" id="health"></span>
  <span id="demos"></span>
  <button id="reset">New call</button>
</header>
<main>
  <div style="display:grid;gap:14px;align-content:start">
    <section>
      <h2>Decision: what the caller asked for</h2>
      <div id="decision" class="decision meta">Nothing asked yet.</div>
    </section>
    <section>
      <h2>Transcript</h2>
      <div id="transcript"></div>
      <div id="preview" class="meta"></div>
      <form id="say">
        <select id="speaker"><option>caller</option><option>agent</option></select>
        <input id="text" placeholder="Type what was said, e.g. I'd like a fuel quote at Teterboro" autocomplete="off">
        <button class="primary">Send</button>
      </form>
    </section>
  </div>
  <div style="display:grid;gap:14px;align-content:start">
    <section><h2>Variables</h2><table id="variables"></table></section>
    <section><h2>Functions</h2><table id="functions"></table></section>
  </div>
</main>
<script>
let callId = "console-" + Date.now(), functions = [];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function send(events) {
  const r = await fetch(`/calls/${callId}/events`, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(events)});
  await r.json();
  render(await (await fetch(`/calls/${callId}`)).json());
}

function render(s) {
  $("transcript").innerHTML = s.transcript.map(l => `<div class="line ${esc(l.speaker)}"><b>${esc(l.speaker)}</b> ${esc(l.text)}</div>`).join("")
    + s.prompts.map(p => `<div class="prompt">Agent prompt: ${esc(p)}</div>`).join("");
  $("transcript").scrollTop = 1e9;
  $("preview").textContent = s.preview ? "(speculative) " + s.preview : "";
  $("variables").innerHTML = Object.entries(s.variables).map(([k, v]) =>
    `<tr><td>${esc(k)}</td><td><b>${esc(v.value)}</b> ${v.label ? `<span class="meta">${esc(v.label)}</span>` : ""}<div class="meta">heard "${esc(v.heard)}" · ${v.confidence}</div></td></tr>`).join("")
    || `<tr><td class="meta">none yet</td></tr>`;
  $("functions").innerHTML = functions.map(f => {
    const r = s.results[f.name], missing = f.needs.filter(n => !(n in s.variables));
    const state = r ? `<span class="ready">called with ${esc(Object.values(r.args).join(", ") || "no args")}</span><div>${esc(r.result.say)}</div>`
      : !f.auto ? `<span class="need">called only when the caller needs it</span>`
      : `<span class="need">needs ${esc(missing.join(", "))}</span>`;
    return `<tr class="fnrow"><td>${esc(f.name)}</td><td class="state">${state}</td></tr>`;
  }).join("");
  const d = s.decision;
  $("decision").className = "decision" + (d && !d.ready ? " waiting" : "") + (d ? "" : " meta");
  $("decision").innerHTML = d ? `<div><span class="fn">${esc(d.function)}</span> ${esc(d.say)}</div>
    <div class="meta">because the caller said "${esc(d.because)}" · decided by ${esc(d.by)}${d.p !== undefined ? ` (p=${d.p})` : ""}</div>`
    : "Nothing asked yet.";
}

$("say").onsubmit = e => {
  e.preventDefault();
  const text = $("text").value.trim(); if (!text) return;
  $("text").value = "";
  send({speaker: $("speaker").value, text});
};
$("reset").onclick = () => { callId = "console-" + Date.now(); render({transcript:[], prompts:[], variables:{}, results:{}, decision:null}); };

(async () => {
  functions = await (await fetch("/functions")).json();
  const h = await (await fetch("/healthz")).json();
  $("health").textContent = "decider: " + h.decider;
  const demos = await (await fetch("/demos")).json();
  $("demos").innerHTML = Object.keys(demos).map(n => `<button data-demo="${esc(n)}">${esc(n.replace(/^demo_/, "").replace(/_/g, " "))}</button>`).join(" ");
  document.querySelectorAll("[data-demo]").forEach(b => b.onclick = async () => {
    $("reset").click();
    for (const line of demos[b.dataset.demo]) {
      // Shaped like Nova Sonic textOutput: USER is the caller, ASSISTANT the agent.
      await send({role: line.speaker === "caller" ? "USER" : "ASSISTANT", content: line.text, generationStage: "FINAL"});
      await new Promise(r => setTimeout(r, 700));
    }
  });
  render({transcript:[], prompts:[], variables:{}, results:{}, decision:null});
})();
</script>
</body>
</html>
