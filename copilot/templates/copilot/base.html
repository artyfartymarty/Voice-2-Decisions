<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Voice-2-Decisions{% endblock %}</title>
<style>
  :root { --bg:#f7f7f5; --card:#fff; --text:#1d1d1b; --muted:#6b6b66; --line:#e3e2dc; --accent:#2f6f4f;
          --decision:#2f6f4f; --action_item:#2557a7; --risk:#b3412b; --question:#8a5a00; --key_moment:#6b3fa0; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161615; --card:#1f1f1d; --text:#ecebe6; --muted:#a3a29b; --line:#33332f; --accent:#6cc497;
            --decision:#6cc497; --action_item:#7aa7f0; --risk:#f08a74; --question:#e0b153; --key_moment:#bb95ea; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding:14px 20px; border-bottom:1px solid var(--line); display:flex; gap:16px; align-items:baseline; }
  header a { color:var(--text); text-decoration:none; font-weight:650; }
  header span { color:var(--muted); font-size:13px; }
  main { max-width:960px; margin:0 auto; padding:20px 16px 60px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px 18px; margin-bottom:16px; }
  h1 { font-size:22px; margin:0 0 12px; } h2 { font-size:16px; margin:0 0 10px; }
  label { display:block; font-size:13px; color:var(--muted); margin:8px 0 4px; }
  input[type=text], input[type=file] { width:100%; padding:7px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--text); }
  button { background:var(--accent); color:#fff; border:0; border-radius:6px; padding:8px 14px; font-weight:600; cursor:pointer; margin-top:12px; }
  button.secondary { background:transparent; color:var(--accent); border:1px solid var(--accent); }
  table { width:100%; border-collapse:collapse; } td, th { text-align:left; padding:6px 4px; border-bottom:1px solid var(--line); }
  a { color:var(--accent); }
  .muted { color:var(--muted); font-size:13px; }
  .tag { display:inline-block; font-size:12px; font-weight:600; padding:1px 8px; border-radius:99px; border:1px solid currentColor; }
  .k-decision { color:var(--decision); } .k-action_item { color:var(--action_item); } .k-risk { color:var(--risk); }
  .k-question { color:var(--question); } .k-key_moment { color:var(--key_moment); }
  .k-quote_request { color:var(--action_item); } .k-dispute_risk { color:var(--question); } .k-sentiment_shift { color:var(--risk); }
  .k-tail_number { color:var(--decision); } .k-agent_prompt { color:var(--question); }
  .prompt { margin-top:6px; padding:8px 10px; border-left:3px solid var(--accent); background:var(--bg); border-radius:4px; }
  .moment { padding:8px 0; border-bottom:1px solid var(--line); }
  .moment:last-child { border-bottom:0; }
  .error { color:var(--risk); }
  .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(120px, 1fr)); gap:8px; }
  .stat { border:1px solid var(--line); border-radius:8px; padding:8px 10px; } .stat b { font-size:20px; display:block; }
  header nav { margin-left:auto; } header nav a { font-weight:500; font-size:14px; color:var(--accent); }
  main.wide { max-width:1280px; }
  /* Call page: prompts beside the transcript on a wide screen, stacked on a narrow one. */
  .call-grid { display:grid; grid-template-columns:minmax(0, 5fr) minmax(0, 6fr); gap:16px; align-items:start; }
  @media (max-width: 860px) { .call-grid { grid-template-columns:1fr; } }
  .sticky { position:sticky; top:12px; }
  .live-dot { display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--risk); margin-right:6px; animation:pulse 1.4s infinite; }
  @keyframes pulse { 50% { opacity:.3; } }
  @media (prefers-reduced-motion: reduce) { .live-dot { animation:none; } }
  .who dl { display:grid; grid-template-columns:max-content 1fr; gap:4px 12px; margin:0; } .who dt { color:var(--muted); font-size:13px; } .who dd { margin:0; }
  .slot { border-radius:8px; padding:10px 12px; margin-bottom:16px; border:1px solid currentColor; font-weight:600; }
  .slot-incomplete, .slot-waiting, .slot-unconfirmed { color:var(--question); } .slot-confirmed { color:var(--decision); font-weight:500; }
  .group { margin-bottom:14px; } .group h3 { font-size:14px; margin:0 0 6px; display:flex; justify-content:space-between; gap:8px; }
  .group h3 span { font-weight:400; color:var(--muted); font-size:12px; }
  .pcard { border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:8px; padding:10px 12px; margin-bottom:8px; background:var(--card); }
  .pcard.k-quote_request { border-left-color:var(--action_item); } .pcard.k-dispute_risk, .pcard.k-agent_prompt { border-left-color:var(--question); }
  .pcard.k-sentiment_shift { border-left-color:var(--risk); } .pcard.k-tail_number { border-left-color:var(--decision); }
  .pcard .head { font-weight:600; color:var(--text); } .pcard .say { margin-top:6px; padding:6px 8px; background:var(--bg); border-radius:4px; color:var(--text); }
  .pcard table { font-size:13px; margin-top:6px; color:var(--text); } .pcard td, .pcard th { padding:3px 4px; vertical-align:top; } .pcard th { color:var(--muted); font-weight:500; width:100px; }
  .pcard.new { animation:flash 2s ease-out; } @keyframes flash { from { background:var(--bg); } }
  .empty { color:var(--muted); font-size:13px; padding:2px 0 6px; }
  .transcript { max-height:70vh; overflow-y:auto; }
  .turn { display:grid; grid-template-columns:72px 1fr; gap:8px; padding:6px 0; border-bottom:1px solid var(--line); margin:0; }
  .turn .who-label { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; }
  .turn.r-agent .who-label { color:var(--action_item); } .turn.r-caller .who-label { color:var(--key_moment); }
  .turn .t { font-size:12px; color:var(--muted); display:block; font-weight:400; text-transform:none; }
  .pending { color:var(--muted); font-style:italic; padding-top:6px; }
  details summary { cursor:pointer; color:var(--muted); }
</style>
</head>
<body>
<header><a href="{% url 'index' %}">Voice-2-Decisions</a><span>Nemotron ASR → winnow → tools</span><nav><a href="{% url 'manager_alerts' %}">Manager alerts</a></nav></header>
<main{% block main_class %}{% endblock %}>{% block content %}{% endblock %}</main>
</body>
</html>
