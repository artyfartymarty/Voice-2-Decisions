<script>
// Live call panels: swap the server-rendered panels (/calls/<id>/panels/) in place. Polls every refreshMs and also
// refreshes on each message from the gateway WebSocket when one is configured. A 204 means nothing changed.
window.v2dLive = function (url, version, opts = {}) {
  const refreshMs = opts.refreshMs || 1500, onUpdate = opts.onUpdate || (() => {});
  let busy = false, timer = null;
  const seen = new Set([...document.querySelectorAll('.pcard[data-id]')].map(el => el.dataset.id));

  async function refresh() {
    if (busy) return;
    busy = true;
    try {
      const r = await fetch(version ? `${url}?v=${encodeURIComponent(version)}` : url);
      if (r.status !== 200) return;
      const data = await r.json();
      version = data.version;
      const box = document.querySelector('[data-scroll]');
      const atBottom = !box || box.scrollHeight - box.scrollTop - box.clientHeight < 40;
      for (const [name, html] of Object.entries(data.panels)) {
        const el = document.getElementById(`panel-${name}`);
        if (el) el.outerHTML = html;
      }
      document.querySelectorAll('.pcard[data-id]').forEach(el => {
        if (!seen.has(el.dataset.id)) { el.classList.add('new'); seen.add(el.dataset.id); }
      });
      const nbox = document.querySelector('[data-scroll]');
      if (nbox && atBottom) nbox.scrollTop = nbox.scrollHeight;
      onUpdate(data);
      if (data.status !== 'live') stop();
    } catch (e) { /* network blip: the next tick retries */ } finally { busy = false; }
  }
  function stop() { clearInterval(timer); timer = null; }

  if (opts.wsUrl) {
    try { new WebSocket(opts.wsUrl).onmessage = ev => { if (timer) refresh(); }; } catch (e) {}
  }
  const box = document.querySelector('[data-scroll]');
  if (box) box.scrollTop = box.scrollHeight;
  timer = setInterval(refresh, refreshMs);
  return { refresh, stop };
};
</script>
