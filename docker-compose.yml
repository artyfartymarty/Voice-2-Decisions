# Voice-2-Decisions on one NVIDIA GPU: web app + speech service + Winnow-12B.
# Models are read from ./models (run scripts/fetch_models.sh first; scripts/setup.sh does everything).
#   docker compose up -d --build
x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  # Speech: NVIDIA NeMo-Speech.cpp (prebuilt release from GitHub, SHA-pinned) serving English Nemotron ASR + Nemotron
  # diarization on :8080 inside the network.
  asr:
    <<: *gpu
    build: ./asr
    image: voice2decisions-asr:latest
    volumes:
      - ./models:/models:ro
    restart: unless-stopped

  # Sentiment: Winnow-12B on winnow-server, built from EldanRing/winnow-inference on GitHub (pinned commit) for the
  # GPU architecture in CUDA_ARCH (setup.sh sets it from nvidia-smi). Runs at 4K context: plenty for one call line,
  # and it keeps the 12B inside VRAM.
  winnow:
    <<: *gpu
    build:
      context: https://github.com/EldanRing/winnow-inference.git#a50c7d0d8cbc5c3ba34987c5c23ea114e44ce6b5
      args:
        CUDA_ARCH: ${CUDA_ARCH:-86;89;120}
    image: winnow-inference:a50c7d0
    entrypoint: ["python3", "/wrap/serve.py", "--model", "q8"]
    environment:
      WINNOW_CONTEXT: ${WINNOW_CONTEXT:-4096}
    volumes:
      - ./models/winnow:/models:ro
      - ./winnow:/wrap:ro
    restart: unless-stopped

  # Web app: Django UI + JSON API, use cases, live calls (streaming diarization from ./models/diar-hf, offline).
  web:
    <<: *gpu
    build: .
    image: voice2decisions:latest
    env_file: .env
    environment:
      DIARIZER_MODEL_ID: /models/diar-hf
      HF_HUB_OFFLINE: "1"
    depends_on:
      asr:
        condition: service_healthy
      winnow:
        condition: service_started   # sentiment falls back to the word list until Winnow is up
    ports:
      - "${PORT:-8080}:8000"
    volumes:
      - v2d-data:/data
      - ./models/diar-hf:/models/diar-hf:ro
      # Real reference data: put customers.csv + location_notes.csv in ./reference, uncomment, set REFERENCE_DIR=/reference
      # - ./reference:/reference:ro
    restart: unless-stopped

  # Fast test suite, no GPU or models: docker compose --profile test run --rm test
  test:
    image: voice2decisions:latest
    profiles: ["test"]
    environment:
      ASR_BACKEND: fake
      DATA_DIR: /data
      SQLITE_PATH: /tmp/test.sqlite3
    volumes:
      - v2d-data:/data
    command: ["pytest", "-q", "-rs"]

volumes:
  v2d-data:
