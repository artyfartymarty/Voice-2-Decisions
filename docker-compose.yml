# CPU-safe base. On a GPU machine add the GPU overlay:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
services:
  # Speech service: NeMo-Speech.cpp with English Nemotron ASR Q8 + Nemotron diarization (used when ASR_BACKEND=nemo_speech)
  asr:
    build: ./asr
    image: voice2decisions-asr:latest
    volumes:
      - asr-models:/models   # pinned GGUFs, downloaded on first start (~0.8 GB)
    restart: unless-stopped

  # Sentiment model for the Customer Experience use case: Winnow (EldanRing/winnow-inference, pinned commit),
  # built from source for the GPU architectures in CUDA_ARCH. WINNOW_TARGET: e2b (default, ~6 GB) or q8 (12B, ~13 GB).
  winnow-download:
    image: winnow-inference:a50c7d0
    user: "0:0"
    entrypoint: ["sh", "-c", "python3 scripts/winnow.py download --model $${WINNOW_TARGET:-e2b} --model-dir /models"]
    environment:
      WINNOW_TARGET: ${WINNOW_TARGET:-e2b}
    volumes:
      - winnow-models:/models

  winnow:
    build:
      context: https://github.com/EldanRing/winnow-inference.git#a50c7d0d8cbc5c3ba34987c5c23ea114e44ce6b5
      args:
        CUDA_ARCH: ${CUDA_ARCH:-86;89;120}
    image: winnow-inference:a50c7d0
    entrypoint: ["python3", "/wrap/serve.py"]
    environment:
      WINNOW_TARGET: ${WINNOW_TARGET:-e2b}
      WINNOW_CONTEXT: ${WINNOW_CONTEXT:-}   # empty = per model: 4096 for q8 (fits in VRAM), 8192 for e2b
    volumes:
      - winnow-models:/models:ro
      - ./winnow:/wrap:ro
    depends_on:
      winnow-download:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build: .
    image: voice2decisions:latest
    env_file: .env
    depends_on:
      asr:
        condition: service_healthy
      winnow:
        condition: service_started   # sentiment falls back to the word list until Winnow is up
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - v2d-data:/data   # sqlite db + Hugging Face model cache, survives rebuilds
      # Real reference data: uncomment, put customers.csv + location_notes.csv in ./reference, set REFERENCE_DIR=/reference
      # - ./reference:/reference:ro
    restart: unless-stopped

  # Test runner: docker compose run --rm test            (fast suite, no GPU or model needed)
  #              docker compose -f docker-compose.yml -f docker-compose.gpu.yml run --rm -e RUN_GPU_TESTS=1 test
  test:
    image: voice2decisions:latest
    profiles: ["test"]
    environment:
      ASR_BACKEND: fake
      DATA_DIR: /data
      HF_HOME: /data/hf
      SQLITE_PATH: /tmp/test.sqlite3
    volumes:
      - v2d-data:/data
    command: ["pytest", "-v", "-rs"]

volumes:
  v2d-data:
  asr-models:
  winnow-models:
